<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Os simpsons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>API dos Simpsons</h1>
    </header>

    <div class="card">
        <input type="text" id="inputNomeSimpson" placeholder="Digite o nome do Simpsons...">
        <button onclick="buscarSimpson()" id="btnPesquisar">Pesquisar</button>
    </div>

    <p id="aviso"></p>

    <div id="resultado"></div>

    <script>
        async function buscarSimpson() {
            const nome = document.getElementById("inputNomeSimpson").value.trim().toLowerCase();
            const aviso = document.getElementById("aviso");
            const resultado = document.getElementById("resultado");

            const resposta = await fetch('https://thesimpsonsapi.com/api/characters/' + nome);

            if (!resposta.ok) {
                aviso.textContent = "Simpson não encontrado"
                return;
            }

            aviso.textContent = "";

            const simpson = await resposta.json();

            resultado.innerHTML = `
                <h2>${simpson.name}</h2>
                <p>Idade: ${simpson.age}</p>
                <p>Ocupação: ${simpson.occupation}</p>

                <img src="https://cdn.thesimpsonsapi.com/500${simpson.portrait_path}" width="200">
            `
        }
    </script>
</body>
</html>
